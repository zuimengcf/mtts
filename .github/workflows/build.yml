name: Build release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing keystores and lineage from secrets
        run: |
          mkdir -p keystore
          echo "${{ secrets.MTTS_KEYSTORE_BASE64 }}" | base64 -d > keystore/zuimeng.jks
          echo "${{ secrets.MTTS_OLD_KEYSTORE_BASE64 }}" | base64 -d > keystore/zuimeng-old.jks
          echo "${{ secrets.MTTS_LINEAGE_BASE64 }}" | base64 -d > lineage.bin
          ls -l keystore/zuimeng.jks keystore/zuimeng-old.jks lineage.bin

      - name: Build release APK
        run: |
          export MTTS_STORE_FILE=keystore/zuimeng.jks
          export MTTS_STORE_PASSWORD="${{ secrets.MTTS_STORE_PASSWORD }}"
          export MTTS_KEY_ALIAS="${{ secrets.MTTS_KEY_ALIAS }}"
          export MTTS_KEY_PASSWORD="${{ secrets.MTTS_KEY_PASSWORD }}"
          gradle :app:assembleRelease --no-daemon

      - name: Rotate signing (v2 old + v3 new via lineage)
        run: |
          export PATH=$PATH:$ANDROID_HOME/build-tools
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          APKSIGNER="$BUILD_TOOLS/apksigner"
          SRC=app/build/outputs/apk/release/app-release.apk
          OUT=app/build/outputs/apk/release/app-release-rotated.apk
          "$APKSIGNER" sign \
            --ks keystore/zuimeng-old.jks --ks-key-alias zuimeng \
            --ks-pass pass:"${{ secrets.MTTS_OLD_STORE_PASSWORD }}" \
            --key-pass pass:"${{ secrets.MTTS_OLD_KEY_PASSWORD }}" \
            --lineage lineage.bin \
            --next-signer \
            --ks keystore/zuimeng.jks --ks-key-alias zuimeng \
            --ks-pass pass:"${{ secrets.MTTS_STORE_PASSWORD }}" \
            --key-pass pass:"${{ secrets.MTTS_KEY_PASSWORD }}" \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v1-signing-enabled false \
            --out "$OUT" "$SRC"
          "$APKSIGNER" verify --verbose --print-certs "$OUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mtts-release-apk
          path: app/build/outputs/apk/release/app-release-rotated.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release-rotated.apk
          generate_release_notes: true
